<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masarat Platform Demo</title>
<meta name="description" content="Interactive multi-role investor demo of the Masarat platform. Demonstration data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>:root {
  --paper: #FAFAF7; --ivory: #F5F4EE; --surface: #FFFFFF; --mist: #EEF6F4; --mist-2: #E0F3F0;
  --navy: #0D182A; --ink: #0D182A; --body: #3B4657; --muted: #5E6876; --faint: #8A939E;
  --line: #E6E9EC; --line-2: #EEF0F2;
  --teal: #14B8A6; --teal-600: #0E9F90; --teal-ink: #0A7A70;
  --indigo: #4A63B5; --indigo-soft: #ECEFFA; --indigo-ink: #3A4F96;
  --green: #22A35A; --green-soft: #E6F6EC; --green-ink: #17703E;
  --amber: #D99A1E; --amber-soft: #FBF2DF; --amber-ink: #7A5300;
  --red: #D9485F; --red-soft: #FCEBEE; --red-ink: #A3283D;
  --slate-soft: #F0F2F4;
  --r-sm: 10px; --r: 14px; --r-lg: 20px; --r-xl: 28px;
  --sh-1: 0 1px 2px rgba(13, 24, 42, .04), 0 1px 1px rgba(13, 24, 42, .03);
  --sh-2: 0 6px 24px -8px rgba(13, 24, 42, .12), 0 2px 6px rgba(13, 24, 42, .04);
  --sh-3: 0 24px 60px -18px rgba(13, 24, 42, .28);
  --f-head: 'Montserrat', 'Readex Pro', system-ui, sans-serif;
  --f-body: 'Readex Pro', 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --side: 248px;
  color-scheme: light;
}
[dir="rtl"] { --f-head: 'Readex Pro', 'IBM Plex Sans Arabic', system-ui, sans-serif; --f-body: 'IBM Plex Sans Arabic', 'Readex Pro', system-ui, sans-serif; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--body); font-family: var(--f-body); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { font-family: var(--f-head); color: var(--ink); margin: 0; line-height: 1.25; letter-spacing: -.01em; }
[dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3, [dir="rtl"] h4 { letter-spacing: 0; }
p { margin: 0; }
svg { flex: none; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.block { display: block; }
.wrap { white-space: normal; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.center { display: flex; justify-content: center; margin-block-start: 28px; }
.ok-text { color: var(--green-ink); } .bad-text { color: var(--red-ink); }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 6px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 11px; border: 1px solid transparent; font-weight: 500; font-size: 14px; white-space: nowrap; transition: background .18s, box-shadow .18s, transform .12s, color .18s, border-color .18s; }
.btn .ico { width: 17px; height: 17px; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--teal-ink); color: #fff; box-shadow: 0 1px 0 rgba(255,255,255,.15) inset, 0 4px 12px -4px rgba(10, 122, 112, .45); }
.btn-primary:hover:not(:disabled) { background: #08685F; }
.btn-soft { background: var(--mist-2); color: var(--teal-ink); }
.btn-soft:hover:not(:disabled) { background: #CDEDE7; }
.btn-ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn-ghost:hover:not(:disabled) { border-color: #CED5DB; background: #FBFCFC; }
.btn-danger { background: var(--red-soft); color: var(--red-ink); }
.btn-danger:hover:not(:disabled) { background: #F8DADF; }
.btn-link { background: none; color: var(--teal-ink); height: auto; padding: 0; font-size: 13.5px; }
.btn-link:hover { text-decoration: underline; }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 9px; gap: 6px; }
.btn-sm .ico { width: 15px; height: 15px; }
.btn.icon-end { flex-direction: row-reverse; }
.icon-btn { width: 38px; height: 38px; border-radius: 11px; display: inline-grid; place-items: center; background: transparent; border: 1px solid transparent; color: var(--muted); position: relative; transition: background .15s, color .15s; }
.icon-btn:hover { background: var(--slate-soft); color: var(--ink); }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn.sm { width: 28px; height: 28px; border-radius: 8px; }
.icon-btn.sm svg { width: 15px; height: 15px; }
.linkish { background: none; border: 0; padding: 0; color: var(--teal-ink); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(10,122,112,.35); }

/* ---------- app shell ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; width: var(--side); flex: none; background: var(--surface); border-inline-end: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 14px; gap: 14px; z-index: 40; }
.side-logo { background: none; border: 0; padding: 0; text-align: start; }
.logo-plate { display: inline-flex; align-items: center; justify-content: center; background: radial-gradient(circle at 15% 0%, #17385A 0%, var(--navy) 62%); border-radius: 14px; box-shadow: var(--sh-2); }
.logo-plate img { display: block; height: auto; }
.lp-xs { padding: 7px 12px; border-radius: 10px; } .lp-xs img { width: 92px; }
.lp-sm { padding: 10px 16px; } .lp-sm img { width: 128px; }
.lp-md { padding: 16px 24px; border-radius: 18px; } .lp-md img { width: 190px; }
.mark-tile { display: inline-grid; place-items: center; border-radius: 12px; background: radial-gradient(circle at 20% 0%, #17385A, var(--navy) 65%); box-shadow: var(--sh-2); }
.mark-tile img { display: block; height: auto; }
.side-role { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: color-mix(in srgb, var(--rt) 8%, white); color: var(--rt); font-weight: 600; font-size: 12.5px; letter-spacing: .02em; }
.side-role svg { width: 16px; height: 16px; }
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.side-link { display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 10px; border: 0; background: none; color: var(--body); font-weight: 500; text-align: start; transition: background .15s, color .15s; position: relative; }
.side-link svg { width: 18px; height: 18px; color: var(--faint); transition: color .15s; }
.side-link:hover { background: var(--slate-soft); color: var(--ink); }
.side-link.on { background: var(--mist); color: var(--teal-ink); }
.side-link.on svg { color: var(--teal-ink); }
.side-link.on::before { content: ''; position: absolute; inset-inline-start: -14px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--teal); }
[dir="rtl"] .side-link.on::before { border-radius: 3px 0 0 3px; }
.side-count { margin-inline-start: auto; font-style: normal; font-size: 11px; font-weight: 600; background: var(--teal-ink); color: #fff; border-radius: 999px; padding: 0 7px; line-height: 18px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line-2); }
.persona { display: flex; gap: 10px; align-items: center; min-width: 0; }
.persona b { display: block; color: var(--ink); font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.persona small { color: var(--muted); font-size: 12px; }
.persona > div { min-width: 0; }
.side-scrim { display: none; }
.demo-badge { display: inline-flex; align-items: center; gap: 7px; align-self: flex-start; font-size: 11.5px; font-weight: 600; color: var(--amber-ink); background: var(--amber-soft); border: 1px solid #F1DEB1; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.demo-badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 3px rgba(217, 154, 30, .2); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 30; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 28px; background: rgba(250, 250, 247, .82); backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line-2); }
.menu-btn { display: none; }
.crumb { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; color: var(--muted); font-weight: 500; padding: 6px 8px; border-radius: 9px; }
.crumb:hover { color: var(--teal-ink); background: var(--mist); }
.crumb svg { width: 17px; height: 17px; }
.top-right { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; }
.dd { position: relative; }
.role-btn { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px 0 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--sh-1); transition: border-color .15s, box-shadow .15s; }
[dir="rtl"] .role-btn { padding: 0 6px 0 12px; }
.role-btn:hover { border-color: #CFD6DC; box-shadow: var(--sh-2); }
.role-btn > svg { width: 16px; height: 16px; color: var(--muted); }
.rb-ico { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: none; }
.rb-ico svg { width: 17px; height: 17px; }
.rb-text { display: flex; flex-direction: column; text-align: start; line-height: 1.2; min-width: 0; }
.rb-text small { font-size: 11px; color: var(--muted); }
.rb-text b { font-size: 13.5px; color: var(--ink); font-weight: 600; }
.dd-menu { position: absolute; inset-inline-end: 0; top: calc(100% + 8px); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--sh-3); padding: 6px; z-index: 60; animation: pop .16s ease-out; }
.role-menu { width: 290px; }
.dd-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 9px 10px; border: 0; background: none; border-radius: 11px; text-align: start; }
.dd-item:hover { background: var(--slate-soft); }
.dd-item.on { background: var(--mist); }
.dd-check { margin-inline-start: auto; color: var(--teal-ink); width: 18px; height: 18px; }
.lang-btn { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; color: var(--ink); }
.lang-btn:hover { border-color: #CFD6DC; }
.lang-btn svg { width: 16px; height: 16px; color: var(--teal-ink); }
.badge-dot { position: absolute; top: 3px; inset-inline-end: 3px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--red); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--paper); }
.notif-menu { width: 360px; padding: 0; overflow: hidden; }
.notif-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line-2); }
.notif-head b { color: var(--ink); }
.notif-menu ul { list-style: none; margin: 0; padding: 6px; max-height: 380px; overflow: auto; }
.notif { width: 100%; text-align: start; display: flex; flex-direction: column; gap: 3px; padding: 10px 12px 10px 24px; border: 0; background: none; border-radius: 10px; position: relative; }
[dir="rtl"] .notif { padding: 10px 24px 10px 12px; }
.notif:hover { background: var(--slate-soft); }
.notif span { color: var(--body); font-size: 13.5px; }
.notif small { color: var(--faint); font-size: 12px; }
.notif.unread span { color: var(--ink); font-weight: 500; }
.notif.unread::before { content: ''; position: absolute; inset-inline-start: 10px; top: 17px; width: 7px; height: 7px; border-radius: 50%; background: var(--teal); }
.notif-empty { padding: 18px; }

.content { padding: 28px 32px 120px; max-width: 1360px; width: 100%; margin: 0 auto; animation: fadeUp .35s ease-out; }
.page { display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.page-head h1 { font-size: 27px; font-weight: 700; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--teal-ink); margin-bottom: 6px; }
[dir="rtl"] .eyebrow { letter-spacing: 0; font-size: 13px; }
.page-sub { color: var(--muted); margin-top: 6px; max-width: 760px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.page-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--sh-1); min-width: 0; }
.card-flush { padding: 0; overflow: hidden; }
.card-flush .card-head { padding: 18px 20px 12px; margin: 0; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.card-title { font-size: 15.5px; font-weight: 600; }
.card-sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.card-action { flex: none; }
.stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.stack.tight { gap: 12px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.grid-2-1 { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 20px; }
.grid-3-1 { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.grid-1-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 20px; align-items: start; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.row-between.full { width: 100%; }

.kpi-row { display: grid; gap: 14px; }
.kpi-row.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi-row.six { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--sh-1); display: flex; flex-direction: column; gap: 8px; min-width: 0; transition: box-shadow .2s, transform .2s; }
.kpi:hover { box-shadow: var(--sh-2); transform: translateY(-1px); }
.kpi-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.kpi-label { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.kpi-ico { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.kpi-ico svg { width: 17px; height: 17px; }
.tone-teal { background: var(--mist-2); color: var(--teal-ink); }
.tone-indigo { background: var(--indigo-soft); color: var(--indigo-ink); }
.tone-green { background: var(--green-soft); color: var(--green-ink); }
.tone-amber { background: var(--amber-soft); color: var(--amber-ink); }
.kpi-value { font-family: var(--f-head); font-size: 26px; font-weight: 700; color: var(--ink); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi-foot { display: flex; gap: 8px; align-items: center; font-size: 12px; }
.delta { color: var(--green-ink); background: var(--green-soft); padding: 1px 8px; border-radius: 999px; font-weight: 600; animation: pop .3s ease-out; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px 3px 8px; border-radius: 999px; white-space: nowrap; }
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill-green { background: var(--green-soft); color: var(--green-ink); }
.pill-amber { background: var(--amber-soft); color: var(--amber-ink); }
.pill-indigo { background: var(--indigo-soft); color: var(--indigo-ink); }
.pill-red { background: var(--red-soft); color: var(--red-ink); }
.pill-slate { background: var(--slate-soft); color: #4D5764; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 8px; white-space: nowrap; }
.tag svg { width: 13px; height: 13px; }
.tag-soft { background: var(--slate-soft); color: #4D5764; }
.tag-teal { background: var(--mist-2); color: var(--teal-ink); }
.tag-amber { background: var(--amber-soft); color: var(--amber-ink); }
.tag-slate { background: var(--slate-soft); color: var(--faint); }

.tabs { display: flex; gap: 4px; padding: 4px; background: #F1F2EE; border-radius: 12px; align-self: flex-start; flex-wrap: wrap; max-width: 100%; }
.tab { border: 0; background: none; padding: 7px 14px; border-radius: 9px; font-weight: 500; font-size: 13.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; transition: background .15s, color .15s, box-shadow .15s; }
.tab:hover { color: var(--ink); }
.tab.on { background: var(--surface); color: var(--ink); box-shadow: var(--sh-1), 0 0 0 1px var(--line); }
.tab-count { font-size: 11px; background: var(--slate-soft); color: var(--muted); padding: 0 7px; border-radius: 999px; line-height: 18px; }
.tab.on .tab-count { background: var(--mist-2); color: var(--teal-ink); }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search { flex: 1 1 260px; max-width: 420px; display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; transition: border-color .15s, box-shadow .15s; }
.search:focus-within { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(20, 184, 166, .12); }
.search svg { width: 17px; height: 17px; color: var(--faint); }
.search input { flex: 1; border: 0; outline: 0; background: none; min-width: 0; }
.select select, .field input, .field select, .field textarea { height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); outline: 0; transition: border-color .15s, box-shadow .15s; }
.select select { padding-inline-end: 30px; max-width: 260px; }
.field textarea { height: auto; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.select select:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(20, 184, 166, .12); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field-label { font-size: 12.5px; font-weight: 600; color: var(--ink); }
.field-hint { font-size: 12px; color: var(--muted); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.form-grid.one { grid-template-columns: 1fr; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; color: var(--body); transition: all .15s; }
.chip svg { width: 14px; height: 14px; }
button.chip:hover:not(:disabled) { border-color: #BFD9D4; color: var(--ink); }
.chip.on { background: var(--mist-2); border-color: #BFE3DC; color: var(--teal-ink); font-weight: 500; }
.chips.static .chip { cursor: default; }
.chip:disabled { cursor: default; }
.type-strip { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.type-strip .chip { flex: none; }
.results-count { margin-top: -8px; }

.toggle { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
.toggle input { position: absolute; opacity: 0; }
.track { width: 40px; height: 23px; border-radius: 999px; background: #D5DADF; position: relative; flex: none; transition: background .2s; margin-top: 1px; }
.thumb { position: absolute; top: 3px; inset-inline-start: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: inset-inline-start .2s; }
.toggle input:checked + .track { background: var(--teal-600); }
.toggle input:checked + .track .thumb { inset-inline-start: 20px; }
.toggle input:focus-visible + .track { outline: 2px solid var(--teal); outline-offset: 2px; }
.toggle-text { display: flex; flex-direction: column; gap: 2px; }
.toggle-text b { font-weight: 500; color: var(--ink); font-size: 13.5px; }
.toggle-text small { color: var(--muted); font-size: 12px; }

.overlay { position: fixed; inset: 0; background: rgba(13, 24, 42, .32); backdrop-filter: blur(3px); z-index: 100; display: grid; place-items: center; padding: 24px; animation: fade .2s ease-out; }
.overlay-side { place-items: stretch end; padding: 0; }
[dir="rtl"] .overlay-side { place-items: stretch start; }
.modal { width: min(560px, 100%); max-height: calc(100vh - 48px); display: flex; flex-direction: column; background: var(--surface); border-radius: 22px; box-shadow: var(--sh-3); animation: rise .25s cubic-bezier(.2, .8, .2, 1); }
.modal-wide { width: min(780px, 100%); }
.modal-head, .drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 20px 22px 14px; border-bottom: 1px solid var(--line-2); }
.modal-head h2, .drawer-head h2 { font-size: 18px; font-weight: 700; }
.modal-head p { margin-top: 4px; font-size: 13px; }
.modal-body { padding: 18px 22px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.modal-foot, .drawer-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--line-2); background: #FCFCFA; border-radius: 0 0 22px 22px; flex-wrap: wrap; }
.drawer { width: min(540px, 100vw); height: 100vh; background: var(--surface); display: flex; flex-direction: column; box-shadow: var(--sh-3); animation: slideIn .28s cubic-bezier(.2, .8, .2, 1); }
[dir="rtl"] .drawer { animation-name: slideInR; }
.drawer-body { flex: 1; overflow: auto; padding: 20px 22px 28px; display: flex; flex-direction: column; gap: 18px; }
.drawer-foot { border-radius: 0; }
.decide { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; width: 100%; }

.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 40px 20px; color: var(--ink); }
.empty-ico { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 14px; background: var(--mist); color: var(--teal-ink); }
.empty-ico svg { width: 22px; height: 22px; }
.avatar { display: inline-grid; place-items: center; border-radius: 50%; font-weight: 700; flex: none; font-family: var(--f-head); letter-spacing: 0; }
.progress { display: block; height: 8px; background: #EDF0F1; border-radius: 999px; overflow: hidden; }
.progress span { display: block; height: 100%; border-radius: 999px; transition: width .8s cubic-bezier(.2, .8, .2, 1); }
.tone-bg-teal { background: linear-gradient(90deg, var(--teal-600), var(--teal)); }
[dir="rtl"] .tone-bg-teal { background: linear-gradient(-90deg, var(--teal-600), var(--teal)); }
.ring { position: relative; display: inline-grid; place-items: center; flex: none; }
.ring svg { position: absolute; inset: 0; }
.ring b { font-family: var(--f-head); font-size: 13px; color: var(--ink); position: relative; }
.ring-arc { transition: stroke-dashoffset 1s cubic-bezier(.2, .8, .2, 1); animation: ringIn 1s cubic-bezier(.2, .8, .2, 1); }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 12px; font-size: 13.5px; }
.note svg { width: 18px; height: 18px; margin-top: 1px; }
.note-info { background: var(--indigo-soft); color: var(--indigo-ink); }
.note-ok { background: var(--green-soft); color: var(--green-ink); }
.note-warn { background: var(--amber-soft); color: var(--amber-ink); }
.toasts { position: fixed; bottom: 24px; inset-inline-end: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 300; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; background: var(--navy); color: #fff; padding: 12px 16px; border-radius: 13px; box-shadow: var(--sh-3); font-size: 13.5px; max-width: 380px; animation: toastIn .3s cubic-bezier(.2, .8, .2, 1); }
.toast svg { color: #5EE3D2; width: 18px; height: 18px; }

/* ---------- charts ---------- */
.chart { position: relative; width: 100%; }
.chart svg { display: block; overflow: visible; }
.grid { stroke: #EEF0F2; stroke-width: 1; }
.axis { fill: var(--faint); font-size: 11px; font-family: var(--f-body); }
.hover-line { stroke: #C8D0D6; stroke-dasharray: 3 4; }
.line-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.2s cubic-bezier(.4, .1, .2, 1) forwards; }
.area-fill { opacity: 0; animation: fade .8s .5s forwards; }
.bar { transition: y .7s cubic-bezier(.2, .8, .2, 1), height .7s cubic-bezier(.2, .8, .2, 1), opacity .15s; }
.tip { position: absolute; transform: translateX(-50%); background: var(--navy); color: #fff; border-radius: 10px; padding: 8px 11px; font-size: 12px; pointer-events: none; display: flex; flex-direction: column; gap: 3px; box-shadow: var(--sh-3); white-space: nowrap; z-index: 5; }
.tip b { font-weight: 600; }
.tip span { display: flex; align-items: center; gap: 6px; color: #D7DEE5; }
.tip i { width: 8px; height: 8px; border-radius: 2px; }
.donut-wrap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.donut { position: relative; flex: none; }
.donut-seg { transition: stroke-dasharray 1s cubic-bezier(.2, .8, .2, 1), stroke-width .15s; cursor: pointer; }
.donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; }
.donut-center b { font-family: var(--f-head); font-size: 24px; color: var(--ink); }
.donut-center small { color: var(--muted); font-size: 11.5px; line-height: 1.3; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 180px; }
.legend li { display: grid; grid-template-columns: 10px 1fr auto 40px; gap: 10px; align-items: center; padding: 5px 8px; border-radius: 8px; font-size: 13px; transition: background .15s; cursor: default; }
.legend li.on, .legend li:hover { background: var(--slate-soft); }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.legend b { color: var(--ink); font-weight: 600; }
.legend em { font-style: normal; color: var(--faint); font-size: 12px; text-align: end; }
.legend-inline { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 12px; }
.legend-inline span { display: inline-flex; align-items: center; gap: 6px; }
.legend-inline i { width: 10px; height: 10px; border-radius: 3px; }
.hbars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.hb-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; margin-bottom: 5px; }
.hb-label { color: var(--body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.hb-row b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.hb-track { display: block; height: 8px; background: #F0F2F1; border-radius: 999px; overflow: hidden; }
.hb-fill { display: block; height: 100%; border-radius: 999px; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.funnel { display: flex; flex-direction: column; gap: 10px; }
.fn-row { display: grid; grid-template-columns: 110px 1fr 44px; align-items: center; gap: 12px; }
.fn-label { font-size: 13px; color: var(--body); }
.fn-track { height: 34px; background: #F4F5F3; border-radius: 10px; overflow: hidden; }
.fn-bar { height: 100%; display: flex; align-items: center; padding-inline-start: 12px; border-radius: 10px; color: #fff; font-size: 13px; transition: width 1s cubic-bezier(.2, .8, .2, 1); min-width: 40px; }
.fn-pct { font-size: 12px; color: var(--muted); text-align: end; font-variant-numeric: tabular-nums; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: center; }
.demand { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.demand li { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 54px; gap: 12px; align-items: center; font-size: 13px; }
.dm-bars { display: flex; flex-direction: column; gap: 3px; }
.dm-a, .dm-s { display: block; height: 7px; border-radius: 999px; animation: grow .9s cubic-bezier(.2, .8, .2, 1); transform-origin: left; }
[dir="rtl"] .dm-a, [dir="rtl"] .dm-s { transform-origin: right; }
.dm-a { background: var(--indigo); } .dm-s { background: #CFE9E4; }

/* ---------- lists & tables ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.list-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 20px; border-top: 1px solid var(--line-2); min-width: 0; }
.list-row:first-child { border-top: 0; }
.list-row > div { display: flex; flex-direction: column; min-width: 0; }
.list-row b { color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-row b.wrap { white-space: normal; }
.list-row.clickable { cursor: pointer; transition: background .15s; }
.list-row.clickable:hover { background: #FAFBFA; }
.list-row.unread { background: linear-gradient(90deg, rgba(20, 184, 166, .06), transparent 60%); }
[dir="rtl"] .list-row.unread { background: linear-gradient(-90deg, rgba(20, 184, 166, .06), transparent 60%); }
.list.bare .list-row { padding-inline: 0; }
.nrow { display: flex !important; flex-direction: row !important; gap: 12px; align-items: center; min-width: 0; }
.nrow > div { display: flex; flex-direction: column; min-width: 0; }
.n-ico { width: 34px; height: 34px; border-radius: 10px; background: var(--mist); color: var(--teal-ink); display: grid; place-items: center; flex: none; }
.n-ico.warn { background: var(--amber-soft); color: var(--amber-ink); }
.n-ico svg { width: 17px; height: 17px; }
.unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); flex: none; }
.row-actions { display: flex; gap: 6px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.table th { text-align: start; font-weight: 600; font-size: 12px; color: var(--muted); padding: 12px 16px; background: #FBFBF9; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 12px 16px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.table tbody tr:last-child td { border-bottom: 0; }
.table tr.clickable { cursor: pointer; }
.table tbody tr { transition: background .15s; }
.table tbody tr:hover { background: #FAFBFA; }
.table b { color: var(--ink); font-weight: 500; }
.table .clip { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.score { font-weight: 600; color: var(--teal-ink); font-variant-numeric: tabular-nums; }
tr.flash, li.flash, .papp.flash { animation: flash 2.4s ease-out 1; }

/* ---------- listing cards & detail ---------- */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card-grid.two { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.lcard { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; transition: box-shadow .2s, transform .2s, border-color .2s; animation: fadeUp .35s ease-out backwards; }
.lcard:hover { box-shadow: var(--sh-2); transform: translateY(-2px); border-color: #D7E5E2; }
.lcard-hit { position: absolute; inset: 0; border: 0; background: none; border-radius: 16px; z-index: 1; }
.lcard-top { display: flex; align-items: center; gap: 10px; }
.lc-ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; }
.lc-ico svg { width: 19px; height: 19px; }
.lc-ico.lg { width: 52px; height: 52px; border-radius: 15px; }
.lc-ico.lg svg { width: 26px; height: 26px; }
.lcard-meta { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.3; }
.lc-type { font-size: 11.5px; font-weight: 600; color: var(--teal-ink); text-transform: uppercase; letter-spacing: .05em; }
[dir="rtl"] .lc-type { letter-spacing: 0; text-transform: none; font-size: 12px; }
.lc-prov { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.verified { width: 14px; height: 14px; color: var(--teal-600); }
.lcard-title { font-size: 15px; font-weight: 600; line-height: 1.35; padding-inline-end: 30px; }
.lcard-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.bm { position: absolute !important; z-index: 2; bottom: 10px; inset-inline-end: 10px; width: 32px; height: 32px; }
.bm.on { color: var(--teal-ink); background: var(--mist); }
.why { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.why li { display: flex; gap: 7px; align-items: flex-start; }
.why svg { width: 14px; height: 14px; color: var(--teal-600); margin-top: 3px; }
.detail { display: flex; flex-direction: column; gap: 18px; }
.detail-hero { display: flex; gap: 14px; align-items: flex-start; }
.detail-title { font-size: 21px; font-weight: 700; margin-bottom: 4px; }
.detail-hero .muted { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; background: #FCFCFA; border: 1px solid var(--line-2); border-radius: 14px; overflow: hidden; }
.facts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.facts > div { box-shadow: 0 0 0 .5px var(--line-2); padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.facts span { font-size: 11.5px; color: var(--muted); }
.facts b { color: var(--ink); font-weight: 600; font-size: 13.5px; }
.detail-desc { font-size: 14.5px; line-height: 1.65; }
.block h4 { font-size: 14px; font-weight: 600; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.checklist, .elig, .achv, .perm { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.checklist li, .elig li, .achv li { display: flex; gap: 9px; align-items: flex-start; font-size: 13.5px; }
.checklist svg, .achv svg { width: 16px; height: 16px; color: var(--teal-600); margin-top: 2px; }
.achv { margin-top: 12px; }
.match-block { display: flex; gap: 16px; align-items: flex-start; padding: 16px; border-radius: 16px; background: linear-gradient(135deg, var(--mist), #F7FBFA); border: 1px solid #DCEFEB; }
.elig { margin: 10px 0; }
.elig li { padding: 8px 12px; border-radius: 10px; animation: fadeUp .3s ease-out backwards; }
.elig li:nth-child(2) { animation-delay: .08s; } .elig li:nth-child(3) { animation-delay: .16s; } .elig li:nth-child(4) { animation-delay: .24s; }
.elig li.ok { background: var(--green-soft); color: var(--green-ink); }
.elig li.no { background: var(--red-soft); color: var(--red-ink); }
.elig svg { width: 17px; height: 17px; margin-top: 1px; }
.detail-cta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-top: 16px; border-top: 1px solid var(--line-2); }
.detail-cta .muted { display: inline-flex; gap: 5px; align-items: center; }
.detail-cta .muted svg { width: 14px; height: 14px; }
.applied { display: flex; align-items: center; gap: 10px; }
.apply-profile { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 12px 14px; border-radius: 14px; background: #FBFBF9; border: 1px solid var(--line-2); }
.apply-profile div { display: flex; flex-direction: column; min-width: 0; }
.apply-profile span { font-size: 11.5px; color: var(--muted); }
.apply-profile b { color: var(--ink); font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
blockquote { margin: 0; padding: 12px 14px; border-inline-start: 3px solid var(--teal); background: #FBFBF9; border-radius: 4px 12px 12px 4px; font-size: 13.5px; color: var(--body); }
[dir="rtl"] blockquote { border-radius: 12px 4px 4px 12px; }
.perm li { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 10px; background: var(--slate-soft); font-size: 13px; }
.perm li.ok { background: var(--green-soft); }
.perm svg { width: 16px; height: 16px; color: var(--muted); }
.perm li.ok svg { color: var(--green-ink); }
.perm b { font-size: 12px; font-weight: 600; color: var(--muted); }
.perm li.ok b { color: var(--green-ink); }

/* ---------- stage tracker ---------- */
.stages { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); position: relative; }
.stages li { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 5px; position: relative; }
.stages li::before { content: ''; position: absolute; top: 13px; inset-inline-start: calc(-50% + 16px); inset-inline-end: calc(50% + 16px); height: 2px; background: #E4E8EB; }
.stages li:first-child::before { display: none; }
.stages li.done::before { background: var(--teal-600); }
.st-dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: #EEF1F3; color: var(--faint); font-size: 12px; font-weight: 600; position: relative; z-index: 1; transition: background .3s, color .3s; }
.st-dot svg { width: 15px; height: 15px; }
.stages li.done .st-dot { background: var(--teal-600); color: #fff; }
.stages li.current .st-dot { box-shadow: 0 0 0 5px rgba(14, 159, 144, .16); }
.stages li.done.neg .st-dot { background: var(--red); }
.stages li.skipped .st-dot { background: #CFE7E3; }
.st-label { font-size: 12px; font-weight: 500; color: var(--ink); }
.st-date { font-size: 11px; color: var(--faint); min-height: 15px; }

/* ---------- student ---------- */
.hero-card { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 28px; padding: 28px; border-radius: var(--r-xl); background: radial-gradient(120% 140% at 0% 0%, #DDF3EF 0%, #F3FAF8 45%, #FFFFFF 100%); border: 1px solid #DCEDE9; box-shadow: var(--sh-1); position: relative; overflow: hidden; }
[dir="rtl"] .hero-card { background: radial-gradient(120% 140% at 100% 0%, #DDF3EF 0%, #F3FAF8 45%, #FFFFFF 100%); }
.hero-card::after { content: ''; position: absolute; width: 280px; height: 280px; border-radius: 50%; border: 40px solid rgba(20, 184, 166, .06); inset-inline-end: -90px; top: -120px; }
.hero-main h1 { font-size: 30px; font-weight: 700; }
.hero-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.hero-stats { display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; }
.completion { background: rgba(255, 255, 255, .8); border: 1px solid #E1EEEB; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.completion b { color: var(--ink); font-family: var(--f-head); }
.mini-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.mini-stats div { background: rgba(255, 255, 255, .8); border: 1px solid #E1EEEB; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; align-items: center; }
.mini-stats b { font-family: var(--f-head); font-size: 20px; color: var(--ink); }
.mini-stats span { font-size: 11.5px; color: var(--muted); text-align: center; }
.coach-card { background: linear-gradient(160deg, #FFFDF7, #FFFFFF); border-color: #F1E6C8; }
.coach-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.coach-ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--navy); color: #5EE3D2; }
.coach-ico svg { width: 21px; height: 21px; }
.coach-card h3 { font-size: 15.5px; margin-bottom: 6px; }
.coach-card p { font-size: 13px; }
.app-card { display: flex; flex-direction: column; gap: 18px; animation: fadeUp .35s ease-out backwards; }
.app-card.is-accepted { border-color: #BFE5CC; background: linear-gradient(180deg, #F6FCF8, #fff 50%); }
.app-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
.app-head > div { display: flex; flex-direction: column; min-width: 0; gap: 2px; }
.app-head h3 { font-size: 16px; }
.app-head b { color: var(--ink); font-weight: 600; }
.app-head .muted { display: inline-flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.app-head .muted svg { width: 13px; height: 13px; }
.profile-head { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
.profile-head > div { flex: 1; min-width: 0; }
.profile-head h2 { font-size: 19px; }
.profile-head h3 { font-size: 16px; }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { display: flex; gap: 14px; padding-bottom: 16px; position: relative; }
.timeline li::before { content: ''; position: absolute; inset-inline-start: 6px; top: 16px; bottom: 0; width: 2px; background: var(--line-2); }
.timeline li:last-child::before { display: none; }
.timeline li > div { display: flex; flex-direction: column; }
.timeline b { color: var(--ink); font-weight: 500; }
.timeline li.todo b { color: var(--muted); font-weight: 400; }
.tl-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #CBD3D9; background: #fff; flex: none; margin-top: 4px; position: relative; z-index: 1; }
.tl-dot.ok { border-color: var(--teal-600); background: var(--teal-600); box-shadow: 0 0 0 4px rgba(14, 159, 144, .12); }

/* ---------- parent ---------- */
.child-switch { display: flex; gap: 8px; }
.child-chip { display: flex; align-items: center; gap: 9px; padding: 6px 14px 6px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); text-align: start; transition: all .15s; }
[dir="rtl"] .child-chip { padding: 6px 6px 6px 14px; }
.child-chip span { display: flex; flex-direction: column; line-height: 1.15; }
.child-chip b { font-size: 13px; color: var(--ink); }
.child-chip small { font-size: 11px; color: var(--muted); }
.child-chip.on { border-color: #BFE3DC; background: var(--mist); box-shadow: 0 0 0 3px rgba(20, 184, 166, .1); }
.papp { border: 1px solid var(--line-2); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.trust-card { display: flex; gap: 12px; align-items: flex-start; background: linear-gradient(160deg, #F4F6FC, #fff); border-color: #DFE4F4; }
.trust-card > svg { width: 22px; height: 22px; color: var(--indigo); margin-top: 2px; }
.trust-card b { color: var(--ink); }

/* ---------- landing ---------- */
.landing { min-height: 100vh; background: radial-gradient(90% 60% at 85% 0%, #E3F4F1 0%, rgba(250, 250, 247, 0) 60%), radial-gradient(60% 40% at 0% 20%, #F3F1E8 0%, rgba(250, 250, 247, 0) 70%), var(--paper); }
[dir="rtl"] .landing { background: radial-gradient(90% 60% at 15% 0%, #E3F4F1 0%, rgba(250, 250, 247, 0) 60%), radial-gradient(60% 40% at 100% 20%, #F3F1E8 0%, rgba(250, 250, 247, 0) 70%), var(--paper); }
.land-nav { max-width: 1240px; margin: 0 auto; padding: 22px 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.land-nav-r { display: flex; align-items: center; gap: 12px; }
.land-hero { max-width: 1240px; margin: 0 auto; padding: 28px 32px 40px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; align-items: center; }
.lh-copy h1 { font-size: clamp(34px, 4.2vw, 52px); font-weight: 800; letter-spacing: -.025em; line-height: 1.08; margin-bottom: 18px; animation: fadeUp .5s ease-out backwards; }
[dir="rtl"] .lh-copy h1 { font-weight: 700; letter-spacing: 0; line-height: 1.3; }
.lead { font-size: 16.5px; line-height: 1.65; color: var(--body); max-width: 600px; animation: fadeUp .5s .08s ease-out backwards; }
.lh-copy .hero-actions { margin-top: 26px; animation: fadeUp .5s .16s ease-out backwards; }
.lh-copy .btn { height: 46px; padding: 0 20px; font-size: 15px; border-radius: 13px; }
.hero-note { display: flex; align-items: center; gap: 6px; margin-top: 16px; }
.hero-note svg { width: 14px; height: 14px; }
.eco { position: relative; width: 100%; max-width: 520px; justify-self: center; animation: fadeIn 1s ease-out; }
.eco svg { width: 100%; height: auto; display: block; overflow: visible; }
.eco-mark { position: absolute; left: 50%; top: 50.4%; transform: translate(-50%, -62%); pointer-events: none; }
.eco-mark .mark-tile { background: none; box-shadow: none; }
.hub-label { fill: #9FB3C6; font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; font-family: 'Montserrat', sans-serif; }
.pulse { transform-origin: 260px 232px; animation: pulse 2.8s ease-out infinite; }
.flowline { stroke-dasharray: 5 6; animation: dash 1.6s linear infinite; }
.orbit { animation: dash 6s linear infinite; }
.eco-link { transition: opacity .2s; }
.eco-link.dim { opacity: .25; }
.eco-node { cursor: default; transition: transform .2s; }
.eco-node circle { transition: r .2s; filter: drop-shadow(0 6px 14px rgba(13, 24, 42, .1)); }
.eco-node.on circle { r: 38; }
.node-label { fill: var(--ink); font-size: 13px; font-weight: 600; font-family: var(--f-body); }
.land-sec { max-width: 1240px; margin: 0 auto; padding: 56px 32px; }
.sec-head { max-width: 720px; margin-bottom: 28px; }
.sec-head h2 { font-size: clamp(26px, 3vw, 34px); font-weight: 700; margin-bottom: 8px; }
.role-cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
.role-card { --rt: var(--teal); position: relative; text-align: start; display: flex; flex-direction: column; gap: 10px; padding: 22px 20px 18px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--sh-1); transition: transform .25s cubic-bezier(.2, .8, .2, 1), box-shadow .25s, border-color .25s; animation: fadeUp .5s ease-out backwards; overflow: hidden; }
.role-card::before { content: ''; position: absolute; inset: 0 0 auto; height: 4px; background: var(--rt); opacity: .85; }
.role-card:hover { transform: translateY(-4px); box-shadow: var(--sh-3); border-color: color-mix(in srgb, var(--rt) 35%, white); }
.rc-ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--rt) 11%, white); color: var(--rt); }
.rc-ico svg { width: 23px; height: 23px; }
.role-card h3 { font-size: 16.5px; }
.rc-desc { font-size: 13px; color: var(--muted); line-height: 1.5; }
.role-card ul { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.role-card li { display: flex; gap: 7px; font-size: 12.5px; align-items: flex-start; color: var(--body); }
.role-card li svg { width: 14px; height: 14px; color: var(--rt); margin-top: 3px; }
.rc-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 8px; }
.rc-foot b { color: var(--ink); font-weight: 500; }
.rc-go { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--rt); font-size: 13.5px; }
.rc-go svg { width: 16px; height: 16px; transition: transform .2s; }
.role-card:hover .rc-go svg { transform: translateX(4px); }
[dir="rtl"] .role-card:hover .rc-go svg { transform: translateX(-4px); }
.flow-sec { background: linear-gradient(180deg, transparent, rgba(238, 246, 244, .6) 30%, rgba(238, 246, 244, .6) 70%, transparent); max-width: none; }
.flow-sec > * { max-width: 1176px; margin-inline: auto; }
.flow { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; counter-reset: f; }
.flow li { --rt: var(--teal); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; position: relative; animation: fadeUp .5s ease-out backwards; }
.fl-n { position: absolute; top: 14px; inset-inline-end: 14px; font-family: var(--f-head); font-weight: 700; font-size: 12px; color: var(--faint); }
.fl-ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--rt) 11%, white); color: var(--rt); }
.fl-ico svg { width: 17px; height: 17px; }
.flow b { color: var(--ink); font-weight: 600; font-size: 13.5px; line-height: 1.35; }
.flow small { color: var(--muted); font-size: 12px; }
.why-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.why-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--sh-1); }
.why-card .kpi-ico { width: 42px; height: 42px; border-radius: 13px; }
.why-card .kpi-ico svg { width: 21px; height: 21px; }
.why-card h3 { font-size: 16.5px; }
.why-card p { font-size: 13.5px; line-height: 1.6; }
.dvp { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.dvp-col { border-radius: 22px; padding: 24px; background: linear-gradient(160deg, #F1FAF7, #fff); border: 1px solid #D5EDE7; }
.dvp-col.planned { background: linear-gradient(160deg, #FFFAEE, #fff); border-color: #F0E3C2; }
.dvp-col h3 { display: flex; align-items: center; gap: 8px; font-size: 16.5px; margin-bottom: 14px; }
.dvp-col h3 svg { width: 20px; height: 20px; color: var(--teal-ink); }
.dvp-col.planned h3 svg { color: var(--amber-ink); }
.dvp-col ul { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; }
.dvp-col li::marker { color: var(--teal-600); }
.dvp-col.planned li::marker { color: var(--amber); }
.land-foot { max-width: 1240px; margin: 0 auto; padding: 28px 32px 48px; display: flex; gap: 18px; align-items: center; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }

/* ---------- guided tour ---------- */
.tour { position: fixed; bottom: 20px; inset-inline-start: 20px; width: 380px; max-width: calc(100vw - 40px); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 30px 70px -20px rgba(13, 24, 42, .38), 0 0 0 1px rgba(13, 24, 42, .02); z-index: 220; padding: 14px 16px 16px; animation: rise .3s cubic-bezier(.2, .8, .2, 1); }
.tour.min { width: 300px; }
.tour-top { display: flex; align-items: center; gap: 4px; margin-bottom: 10px; }
.tour-steps { display: flex; gap: 4px; flex: 1; }
.tour-steps i { flex: 1; height: 5px; border-radius: 999px; background: #E9ECEE; cursor: pointer; transition: background .3s; }
.tour-steps i.ok { background: var(--teal-600); }
.tour-steps i.now { background: var(--navy); }
.tour-steps i.now.ok { background: var(--teal-ink); box-shadow: 0 0 0 2px rgba(10,122,112,.2); }
.tour-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tour-role { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--rt); background: color-mix(in srgb, var(--rt) 10%, white); padding: 4px 10px; border-radius: 999px; }
.tour-role svg { width: 14px; height: 14px; }
.tour-body { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.tour-body h3 { font-size: 16px; display: flex; gap: 7px; align-items: center; }
.tour-body p { font-size: 13.5px; color: var(--body); line-height: 1.55; }
.ok-ico { width: 18px; height: 18px; color: var(--green); }
.tour-done { color: var(--green-ink) !important; font-weight: 500; }
.tour-actions { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.tour-actions .btn:last-child { margin-inline-start: auto; }
.spot { position: fixed; z-index: 210; border-radius: 14px; pointer-events: none; box-shadow: 0 0 0 3px var(--teal), 0 0 0 9px rgba(20, 184, 166, .22); animation: spot 1.6s ease-in-out infinite; transition: left .25s, top .25s, width .25s, height .25s; }

/* ---------- animation ---------- */
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes slideInR { from { transform: translateX(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes ringIn { from { stroke-dashoffset: 200; } }
@keyframes dash { to { stroke-dashoffset: -22; } }
@keyframes pulse { 0% { transform: scale(.9); opacity: .9; } 100% { transform: scale(1.35); opacity: 0; } }
@keyframes flash { 0%, 40% { background: rgba(20, 184, 166, .14); } 100% { background: transparent; } }
@keyframes spot { 0%, 100% { box-shadow: 0 0 0 3px var(--teal), 0 0 0 9px rgba(20, 184, 166, .22); } 50% { box-shadow: 0 0 0 3px var(--teal), 0 0 0 15px rgba(20, 184, 166, .08); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

/* ---------- responsive ---------- */
@media (max-width: 1280px) {
  .kpi-row.six { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .role-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 1100px) {
  .grid-3-1, .grid-2-1, .grid-1-2 { grid-template-columns: 1fr; }
  .kpi-row.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .land-hero { grid-template-columns: 1fr; }
  .eco { max-width: 440px; }
}
@media (max-width: 960px) {
  .sidebar { position: fixed; inset-block: 0; inset-inline-start: 0; transform: translateX(-105%); transition: transform .25s cubic-bezier(.2, .8, .2, 1); box-shadow: var(--sh-3); }
  [dir="rtl"] .sidebar { transform: translateX(105%); }
  .sidebar.open { transform: none !important; }
  .side-scrim { display: block; position: fixed; inset: 0; background: rgba(13, 24, 42, .3); z-index: 39; }
  .menu-btn { display: inline-grid; }
  .topbar { padding: 0 16px; }
  .crumb span { display: none; }
  .content { padding: 20px 16px 140px; }
  .grid-2, .why-grid, .dvp, .split { grid-template-columns: 1fr; }
  .role-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero-card { grid-template-columns: 1fr; }
  .hide-sm { display: none; }
}
@media (max-width: 640px) {
  .rb-text small { display: none; }
  .role-btn { padding: 0 8px 0 6px; }
  .kpi-row.six, .kpi-row.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .role-cards, .flow { grid-template-columns: 1fr; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .apply-profile { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .form-grid { grid-template-columns: 1fr; }
  .land-nav, .land-hero, .land-sec, .land-foot { padding-inline: 16px; }
  .land-nav .demo-badge { display: none; }
  .mini-stats { grid-template-columns: repeat(2, 1fr); }
  .fn-row { grid-template-columns: 84px 1fr 38px; }
  .page-head h1 { font-size: 23px; }
  .tour { inset-inline: 10px; bottom: 10px; width: auto; max-width: none; }
  .lang-btn span { display: none; }
}
.eco-ico { width: 26px; height: 26px; display: grid; place-items: center; }
.list-row .row-actions { flex-wrap: nowrap; flex: none; }
.split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.split > *, .card > .chart { min-width: 0; }
.app, .landing { overflow-x: clip; }
.toasts { bottom: auto; top: 76px; }
@media (max-width: 960px) { .split { grid-template-columns: minmax(0, 1fr); } }
.table .row-actions { flex-wrap: nowrap; }
.scen { gap: 10px; flex-wrap: wrap; }
.uni li svg { color: var(--indigo); }
.perf { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.perf div { background: #FBFBF9; border: 1px solid var(--line-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.perf b { font-family: var(--f-head); font-size: 24px; color: var(--ink); }
.perf span { font-size: 12.5px; color: var(--muted); }
.perf-note { margin-top: 12px; }

/* ===== Masarat · Paths module ===== */
.px-letter { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 14px; flex: none; }
.px-letter-sm { width: 24px; height: 24px; border-radius: 7px; font-size: 12px; }
.px-letter-lg { width: 48px; height: 48px; border-radius: 13px; font-size: 22px; }
.px-letter-xl { width: 60px; height: 60px; border-radius: 16px; font-size: 28px; box-shadow: var(--sh-2); }
.px-i { width: 18px; height: 18px; color: var(--teal-ink); flex: none; }
.px-h2 { font-size: 18px; font-weight: 700; }
.px-note { text-align: center; max-width: 640px; margin-inline: auto; }
.px-warn { color: var(--amber-ink); }
.px-flip svg { transition: none; }
[dir="rtl"] .px-flip svg { transform: scaleX(-1); }

/* code card */
.px-code { display: flex; flex-direction: column; gap: 16px; background: radial-gradient(120% 160% at 100% 0%, #E0F3F0 0%, #F6FBFA 45%, #FFFFFF 100%); border-color: #DCEDE9; }
.px-code-main { display: flex; align-items: stretch; gap: 24px; flex-wrap: wrap; }
.px-code-block { display: flex; flex-direction: column; gap: 6px; min-width: 0; position: relative; }
.px-code-block .eyebrow { margin: 0; }
.px-code-letters { display: flex; gap: 14px; align-items: flex-end; }
.px-code-l { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.px-code-l small { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.px-code-sep { width: 1px; background: var(--line); align-self: stretch; }
.px-mbti-big { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 40px; letter-spacing: .04em; color: var(--ink); line-height: 1.1; }

.px-code-foot { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding-top: 14px; border-top: 1px solid var(--line-2); }
.px-code-today { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--ink); min-width: 0; }
.px-code-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.px-preview-tag { align-self: flex-start; font-size: 11px; font-weight: 600; color: var(--amber-ink); background: var(--amber-soft); border-radius: 999px; padding: 1px 9px; }
.px-preview { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.px-preview select { height: 40px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); padding: 0 10px; color: var(--ink); font-weight: 500; max-width: 100%; }

/* tests */
.px-test { display: flex; flex-direction: column; gap: 10px; }
.px-test-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.px-test-res { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; background: var(--paper); border: 1px solid var(--line-2); border-radius: 12px; }
.px-inline-code { display: flex; gap: 6px; }
.px-test-meta { display: flex; gap: 14px; }
.px-test-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.px-test-soon { background: var(--ivory); box-shadow: none; }
.px-test-soon .btn { align-self: flex-start; margin-top: auto; }
.px-grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.px-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.px-run { display: flex; flex-direction: column; gap: 16px; max-width: 760px; width: 100%; margin-inline: auto; }
.px-q { display: flex; flex-direction: column; gap: 14px; animation: fadeUp .25s ease-out; }
.px-q-title { font-size: 22px; font-weight: 700; line-height: 1.4; }
.px-likert { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.px-opt { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; min-height: 76px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; color: var(--body); text-align: center; transition: border-color .15s, background .15s, transform .12s; }
.px-opt b { font-family: 'Montserrat', sans-serif; font-size: 18px; color: var(--ink); }
.px-opt:hover { border-color: var(--teal); background: var(--mist); }
.px-opt.on { border-color: var(--teal-ink); background: var(--mist-2); color: var(--teal-ink); font-weight: 600; }
.px-opt:active { transform: translateY(1px); }
.px-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.px-stmt { display: flex; gap: 10px; align-items: flex-start; padding: 14px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line-2); }

.px-stmt-k { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--indigo-soft); color: var(--indigo-ink); font-weight: 700; font-size: 13px; }

.px-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--indigo); }
.px-dot-0 { width: 26px; height: 26px; background: var(--indigo); }
.px-dot-1 { background: var(--indigo-soft); }
.px-dot-2 { width: 16px; height: 16px; border-color: var(--faint); }

.px-bar { height: 8px; border-radius: 99px; background: var(--slate-soft); overflow: hidden; flex: 1; min-width: 40px; }
.px-bar i { display: block; height: 100%; border-radius: 99px; transform-origin: left; animation: grow .6s ease-out; }
[dir="rtl"] .px-bar i { transform-origin: right; }

/* results */
.px-hex-wrap { display: grid; grid-template-columns: minmax(0, 240px) minmax(0, 1fr); gap: 18px; align-items: center; }
.px-hex { width: 100%; max-width: 240px; height: auto; margin-inline: auto; display: block; }
.px-rank { display: flex; flex-direction: column; gap: 10px; }
.px-rank-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.px-rank-row b { width: 34px; text-align: end; color: var(--ink); font-variant-numeric: tabular-nums; }
.px-rank-n { width: 108px; flex: none; color: var(--body); }
.px-rank-row:not(.top) { opacity: .72; }
.px-acc { display: flex; align-items: baseline; gap: 10px; }
.px-acc b { font-family: 'Montserrat', sans-serif; font-size: 32px; font-weight: 800; color: var(--teal-ink); }

/* validation */

/* map */
.px-map-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
.px-map { position: relative; height: 600px; border-radius: 18px; background:
  radial-gradient(circle at 1px 1px, #DCE3E8 1px, transparent 0) 0 0 / 22px 22px,
  linear-gradient(180deg, #F6FBFA 0%, #FFFFFF 50%, #F7F7F2 100%); border: 1px solid var(--line-2); overflow: hidden; }
.px-map-lines { position: absolute; inset: 0; width: 100%; height: 100%; }

.px-edge { fill: none; stroke: #9BD8CF; stroke-width: 2.5; }

.px-node { position: absolute; transform: translate(-50%, -30px); display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none; padding: 4px; width: 140px; text-align: center; z-index: 1; border-radius: 14px; }

.px-node-dot { position: relative; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--teal); color: var(--teal-ink); box-shadow: var(--sh-2); transition: transform .18s, box-shadow .18s; }

.px-node[class*="px-node-d"] .px-node-dot { border-color: var(--nc); color: var(--nc); background: var(--ns); }
.px-node.picked .px-node-dot { background: var(--nc); color: #fff; }
.px-node-me .px-node-dot { width: 62px; height: 62px; background: var(--navy); color: #fff; border-color: var(--navy); }
.px-node-t { background: rgba(255,255,255,.88); padding: 0 6px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.px-node-s { font-size: 11px; color: var(--muted); background: rgba(255,255,255,.88); padding: 0 6px; border-radius: 6px; }
.px-node:hover .px-node-dot { transform: scale(1.08); }
.px-node.sel .px-node-dot { box-shadow: 0 0 0 4px rgba(20, 184, 166, .25), var(--sh-2); transform: scale(1.08); }
.px-node.lock .px-node-dot { border-color: #C9CED4; color: #9AA3AD; background: #F3F4F5; box-shadow: none; }

.px-node-week .px-node-dot { width: 64px; height: 64px; border-width: 3px; }

.px-node-week.gate.ready .px-node-dot::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--amber); animation: pulse 1.6s ease-out infinite; }
.px-node-week:not(.gate) .px-node-dot { background: var(--teal); color: #fff; border-color: var(--teal-ink); }
.px-detail { padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--paper); min-height: 200px; animation: fadeIn .2s ease-out; }

/* locked + unlocked sections */
.px-locked { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: repeating-linear-gradient(135deg, #FAFAF7 0 12px, #F3F3EE 12px 24px); border-style: dashed; }

.px-eval { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; border: 1px solid #C9EBD5; background: linear-gradient(180deg, var(--green-soft), var(--surface) 60%); animation: rise .35s ease-out; }

.px-quote { margin: 0; padding: 10px 14px; border-inline-start: 3px solid var(--green); background: var(--surface); border-radius: 8px; font-style: italic; color: var(--ink); }
.px-mini { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--paper); font-weight: 500; color: var(--ink); }
.px-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.px-step { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; background: var(--mist); color: var(--ink); font-weight: 500; font-size: 13.5px; }
